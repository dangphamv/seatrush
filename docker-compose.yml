services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: seatrush, POSTGRES_PASSWORD: seatrush, POSTGRES_DB: seatrush }
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_preload_libraries=pg_stat_statements"]
    ports: ["5440:5432"]
    volumes: [pgdata:/var/lib/postgresql/data, ./scripts:/scripts:ro]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "seatrush"], interval: 2s, retries: 20 }
  redis:
    image: redis:7-alpine
    ports: ["6390:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 2s, retries: 20 }
volumes:
  pgdata:
